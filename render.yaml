# Blueprint Render — app.formalist.fr
# Render -> New -> Blueprint -> sélectionne ce dépôt.
services:
  - type: web
    name: formalist-app
    runtime: docker
    region: frankfurt          # EU (RGPD) — proche France
    plan: starter              # un disque persistant exige un plan payant (>= Starter)
    healthCheckPath: /connexion
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://app.formalist.fr
      # Adresse de l'application, distincte de celle du site vitrine. Elle porte les
      # liens envoyés par email - confirmation d'inscription, réinitialisation de
      # mot de passe, invitation d'équipe - et le retour de paiement Stripe. Sans
      # elle, sa valeur par défaut est http://localhost:3000 et ces liens sont
      # inutilisables. NEXT_PUBLIC_SITE_URL ne convient pas : elle désigne
      # formalist.fr, pour le plan du site et les adresses canoniques.
      - key: APP_URL
        value: https://app.formalist.fr
      # Renseigner ces secrets dans le dashboard Render (Environment) :
      - key: GEMINI_API_KEY
        sync: false
      # INPI RNE — requis pour capital, statuts, OCR et extraction du représentant
      - key: INPI_USERNAME
        sync: false
      - key: INPI_PASSWORD
        sync: false
      # Guichet unique — dépôt des formalités. Autre portail, autre compte que le RNE
      # ci-dessus. GUICHET_HOTE vide = démonstration : une configuration incomplète ne
      # doit jamais déposer en production.
      - key: GUICHET_HOTE
        sync: false
      - key: GUICHET_USERNAME
        sync: false
      - key: GUICHET_PASSWORD
        sync: false
      # Base Postgres (Neon) : l'application n'utilise plus SQLite.
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # L'expéditeur des emails transactionnels, et le domaine à vérifier dans
      # Resend. Sans lui, envoi.ts retombe sur onboarding@resend.dev - l'adresse
      # du bac à sable, qui ne livre qu'au titulaire du compte Resend et rejette
      # tous les autres destinataires. Un client s'inscrivait alors sans jamais
      # recevoir son lien de confirmation, et l'inscription semblait avoir
      # abouti : rien ne remontait.
      - key: MAIL_FROM
        value: Formalist <contact@formalist.fr>
      - key: ADMIN_EMAIL
        sync: false
      # Paiement des consultations juridiques. La clé de production n'est acceptée
      # qu'ici : hors production, le code refuse une clé sk_live_ pour qu'un
      # lancement en développement ne touche pas le compte réel.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Secret du point de terminaison à créer dans le tableau de bord Stripe, sur
      # https://app.formalist.fr/api/paiement/webhook, abonné aux événements
      # checkout.session.completed et checkout.session.expired. Le secret du
      # tableau de bord et celui de « stripe listen » sont différents : celui-ci est
      # le premier.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: formalist-data
      # uploads/ y est relié (voir Dockerfile). Les données sont désormais dans
      # Postgres ; ce disque ne porte plus que les pièces déposées, et
      # disparaîtra avec le passage au stockage objet.
      mountPath: /app/persist
      sizeGB: 1
